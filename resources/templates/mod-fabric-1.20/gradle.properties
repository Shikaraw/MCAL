# ---------------------------------------------------------------------
#  Fabric 模组构建属性（MC 1.20.1 / Java 17）
#
#  ⚠ 版本号请以官方为准，这里给的是“曾经可用”的参考值：
#    https://fabricmc.net/develop/                     -> yarn_mappings / loader_version / fabric_version
#    https://maven.fabricmc.net/net/fabricmc/fabric-loom/ -> loom 版本（build.gradle 里的 loom_version）
#  构建时报 "Could not find xxx" 或 "Failed to resolve"，先来这里替换版本号。
# ---------------------------------------------------------------------

# gradle 自身参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 与映射
minecraft_version=1.20.1
# Yarn 映射：格式为 <mc版本>+build.<数字>，数字越大越新
yarn_mappings=1.20.1+build.10

# 加载器与 API
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# loom（Gradle 插件）版本
loom_version=1.6.5

# 模组元数据
mod_version={{modVersion}}
maven_group={{package}}
archives_base_name={{modid}}
