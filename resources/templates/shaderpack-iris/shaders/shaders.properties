# ---------------------------------------------------------------------
#  shaders.properties —— Iris / OptiFine 通用的光影包配置
#
#  用法要点：
#   - 本文件只定义「设置界面长什么样」；选项本身（名字、默认值、可选值）
#     由 GLSL 源码里的 `#define NAME 值 // [可选值1 可选值2]` 注释声明，
#     参见 lib/options.glsl；
#   - `#` 开头为注释；不要用 Tab 缩进；
#   - `screen` 定义设置界面分组，`sliders` 让选项显示为滑条。
# ---------------------------------------------------------------------

# 设置界面的屏幕列表（第一个会被打开）
screen = [POST_PROCESSING] [WORLD] [DEBUG_OPTS]

# 每个屏幕的列布局；columns 指定列数
screen.POST_PROCESSING = [TONEMAP] [COLOR]
screen.POST_PROCESSING.columns = 2

screen.WORLD = [LIGHTING] [FOG]
screen.WORLD.columns = 2

screen.DEBUG_OPTS = [DEBUG]
screen.DEBUG_OPTS.columns = 1

# 滑条：名字列在这里的选项以滑块形式呈现；其它选项按 // [..] 可选值呈现为下拉
sliders = EXPOSURE SATURATION SHADOW_BLUR

# 把非常用选项折叠进「高级」区域（界面更清爽）
# screen.POST_PROCESSING = [TONEMAP] [COLOR] <empty> [ADVANCED]

# ---------------------------------------------------------------------
#  多档预设（profiles）：在设置界面提供「低/中/高」一键切换
# ---------------------------------------------------------------------
profiles = low medium high
profile.low = TONEMAP_MODE=0 SHADOW_QUALITY=0
profile.medium = TONEMAP_MODE=1 SHADOW_QUALITY=1
profile.high = TONEMAP_MODE=2 SHADOW_QUALITY=2

# ---------------------------------------------------------------------
#  其它常用开关（按需启用）
# ---------------------------------------------------------------------
# shadow.culling = off        # 关闭阴影剔除（排查阴影缺失时有用）
# rain.depth = off            # 让雨在 depth 上不写入（解决雨天水面异常）
# blend.<程序名> = off        # 关闭某个程序的混合
# alphaTest.<程序名> = off    # 关闭某个程序的 alpha 测试

# 光影包信息（Iris 设置界面会显示）
# 注意：OptiFine 还会读取根目录的 README.md / 图标（shaders/../）
