# ---------------------------------------------------------------------
#  NeoForge 模组构建属性（MC 1.21 / Java 21）
#
#  版本号以官方为准：
#    NeoForge 本体  https://projects.neoforged.net/neoforged/neoforge
#    NeoGradle 插件 https://projects.neoforged.net/neoforged/neogradle
#  ⚠ NeoForge 版本第二段跟 MC 小版本绑定：21.0.x -> MC 1.21，21.1.x -> MC 1.21.1。
# ---------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 模组元数据
mod_id={{modid}}
mod_name={{modName}}
mod_license={{license}}
mod_version={{modVersion}}
mod_group_id={{package}}
mod_authors={{author}}
mod_description={{description}}

# Minecraft / NeoForge
minecraft_version=1.21
minecraft_version_range=[1.21,1.22)
neo_version=21.0.167
neo_version_range=[21.0.0,)
loader_version_range=[1,)

# net.neoforged.gradle.userdev 插件版本（官方 MDK 也使用版本范围）
neoform_gradle_version=7.0.145

# 映射：1.20.2+ 起 NeoForge 用 Mojang 官方命名，无需再指定映射渠道
