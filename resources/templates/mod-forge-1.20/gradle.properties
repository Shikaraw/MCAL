# ---------------------------------------------------------------------
#  Forge 模组构建属性（MC 1.20.1 / Java 17）
#  版本号以官方为准：https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
#  构建报 "Could not find net.minecraftforge:forge:1.20.1-xxx" 时替换 forge_version 即可。
# ---------------------------------------------------------------------

# Gradle 自身参数
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 模组元数据（mods.toml 里的值直接写死在模板中，这里保留一份便于统一修改）
mod_id={{modid}}
mod_name={{modName}}
mod_license={{license}}
mod_version={{modVersion}}
mod_group_id={{package}}
mod_authors={{author}}
mod_description={{description}}

# Minecraft / Forge 版本
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# 1.20.1 的 Forge 版本形如 47.x.y，请按上面的官网链接确认
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)

# 映射：1.20+ 官方推荐 official（Mojang 官方混淆映射，无需下载 MCP）
mapping_channel=official
mapping_version=1.20.1
